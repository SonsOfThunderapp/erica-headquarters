<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Erica Diaz Team</title>
<meta name="description" content="Erica Diaz Team headquarters — Winter Garden, Florida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1628;
    --navy-deep: #06101c;
    --gold: #C9A227;
    --gold-light: #e8d48b;
    --glass: rgba(201, 162, 39, 0.08);
    --text: #f5f0e6;
    --muted: rgba(245, 240, 230, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--navy-deep); color: var(--text); }
  body {
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .splash {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px calc(48px + env(safe-area-inset-bottom));
    background: radial-gradient(ellipse at 50% 30%, rgba(201,162,39,0.12) 0%, transparent 60%), var(--navy-deep);
    position: relative;
  }
  .splash::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.4;
  }
  .trust-line {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--gold);
    margin-bottom: 28px;
    line-height: 1.7;
    max-width: 22em;
  }
  .trust-rule {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 0 auto 28px;
    opacity: 0.6;
  }
  .erica-anchor {
    width: 152px;
    height: 152px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: var(--navy);
    margin-bottom: 28px;
    overflow: hidden;
    box-shadow: 0 0 0 6px rgba(201,162,39,0.12), 0 16px 40px rgba(0,0,0,0.35);
  }
  .erica-anchor img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    display: block;
  }
  .brand {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }
  .brand span { color: var(--gold); }
  .tagline {
    font-size: 13px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  .modules {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 420px;
  }
  .module {
    background: var(--glass);
    border: 1px solid rgba(201,162,39,0.2);
    border-radius: 16px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: var(--text);
  }
  .module:hover, .module:active {
    background: rgba(201,162,39,0.15);
    border-color: var(--gold);
    transform: translateY(-2px);
  }
  .module.hero {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(201,162,39,0.18), rgba(201,162,39,0.06));
    border-color: var(--gold);
  }
  .module.soon {
    opacity: 0.45;
    cursor: default;
    pointer-events: none;
  }
  .module.soon:hover { transform: none; background: var(--glass); border-color: rgba(201,162,39,0.2); }
  .module-icon {
    font-size: 28px;
    margin-bottom: 12px;
    color: var(--gold);
  }
  .module-label {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  .module-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.05em;
  }
  .footer {
    margin-top: 28px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  @media (min-width: 720px) {
    .trust-line { font-size: 16px; }
    .erica-anchor { width: 168px; height: 168px; }
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="trust-line">Over seven hundred million sold. Eight hundred five-star reviews. Top one percent in Florida.</div>
    <div class="trust-rule"></div>
    <div class="erica-anchor">
      <img src="assets/erica-anchor.svg" alt="Erica Diaz" width="168" height="168">
    </div>
    <div class="brand">Erica <span>Diaz</span> Team</div>
    <div class="tagline">Real Estate, Reimagined</div>
    <div class="modules">
      <a class="module hero" href="https://erica-openhouse-f61590a4.netlify.app">
        <div class="module-icon">&#9670;</div>
        <div class="module-label">Open House</div>
        <div class="module-sub">Live now</div>
      </a>
      <a class="module" href="radar/">
        <div class="module-icon">&#9679;</div>
        <div class="module-label">Radar</div>
        <div class="module-sub">Neighborhood pulse</div>
      </a>
      <div class="module soon">
        <div class="module-icon">&#9675;</div>
        <div class="module-label">Showings</div>
        <div class="module-sub">Coming soon</div>
      </div>
      <div class="module soon">
        <div class="module-icon">&#9993;</div>
        <div class="module-label">Newsletter</div>
        <div class="module-sub">Coming soon</div>
      </div>
      <div class="module soon">
        <div class="module-icon">&#9733;</div>
        <div class="module-label">Journey</div>
        <div class="module-sub">Coming soon</div>
      </div>
    </div>
    <div class="footer">Erica Diaz Team &middot; Winter Garden, FL</div>
  </div>
</body>
</html>
