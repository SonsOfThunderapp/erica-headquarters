<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Erica Diaz Team — Headquarters</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #04A2B3;
  --teal-soft: #E6F4F6;
  --teal-mid: #B8E0E6;
  --bg: #F7FBFC;
  --card: #FFFFFF;
  --text: #1C2B33;
  --muted: #5A6B73;
  --border: rgba(4,162,179,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: Inter, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  padding-bottom: 72px;
}
header {
  padding: 28px 20px 16px;
  text-align: center;
}
.logo-script {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
  font-size: 28px;
  color: var(--teal);
  letter-spacing: 1px;
}
.logo-sub {
  font-size: 9px;
  letter-spacing: 3.5px;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: -2px;
}
.tagline {
  font-size: 11px;
  letter-spacing: 2.5px;
  color: var(--muted);
  margin-top: 8px;
  text-transform: uppercase;
}
.photo-wrap {
  display: flex;
  justify-content: center;
  margin: 16px 0 8px;
}
.photo {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  border: 3px solid var(--teal);
  object-fit: cover;
  box-shadow: 0 4px 20px rgba(4,162,179,0.2);
}
.name {
  font-family: "Cormorant Garamond", serif;
  font-size: 26px;
  text-align: center;
  color: var(--teal);
  margin-top: 4px;
}
.cards {
  padding: 12px 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 2px 12px rgba(4,162,179,0.06);
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 88px;
}
.card:active { transform: scale(0.98); }
.card h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.3px;
}
.card p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}
.wide { grid-column: 1 / -1; }
.radar-preview {
  margin-top: 8px;
  height: 60px;
  background: radial-gradient(circle at center, var(--teal-soft) 0%, transparent 70%);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
}
.ring {
  position: absolute;
  border: 1.5px solid rgba(4,162,179,0.35);
  border-radius: 50%;
  left: 50%; top: 50%;
  transform: translate(-50%,-50%);
}
.ring1 { width: 24px; height: 24px; }
.ring2 { width: 44px; height: 44px; }
.ring3 { width: 64px; height: 64px; }
.dot-center {
  position: absolute;
  width: 8px; height: 8px;
  background: var(--teal);
  border-radius: 50%;
  left: 50%; top: 50%;
  transform: translate(-50%,-50%);
  box-shadow: 0 0 0 3px rgba(4,162,179,0.25);
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: white;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  z-index: 100;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  color: var(--muted);
  text-decoration: none;
  letter-spacing: 0.5px;
}
.nav-item.active { color: var(--teal); font-weight: 600; }
.nav-item span { font-size: 18px; }
@media (min-width: 600px) {
  .app { max-width: 900px; }
  .cards { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo-script">erica diaz</div>
    <div class="logo-sub">TEAM · REAL ESTATE</div>
    <div class="tagline">Winter Garden’s Premier Real Estate Team</div>
  </header>

  <div class="photo-wrap">
    <img class="photo" src="https://ericadiazteam.com/wp-content/uploads/2024/10/erica-diaz-logo2.webp" alt="Erica Diaz" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 88 88%22%3E%3Ccircle cx=%2244%22 cy=%2244%22 r=%2244%22 fill=%22%2304A2B3%22/%3E%3Ctext x=%2244%22 y=%2250%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2228%22 font-family=%22serif%22%3EED%3C/text%3E%3C/svg%3E'">
  </div>
  <div class="name">erica diaz</div>

  <div class="cards">
    <a class="card" href="/radar">
      <h3>Neighborhood Radar</h3>
      <p>What’s nearby</p>
      <div class="radar-preview">
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>
        <div class="dot-center"></div>
      </div>
    </a>
    <a class="card" href="#">
      <h3>This week’s Showings</h3>
      <p>7 scheduled</p>
    </a>
    <a class="card" href="#">
      <h3>Browse homes</h3>
      <p>Active listings</p>
    </a>
    <a class="card" href="https://erica-openhouse-f61590a4.netlify.app" target="_blank">
      <h3>Open houses</h3>
      <p>This weekend</p>
    </a>
    <a class="card" href="#">
      <h3>Newsletter</h3>
      <p>Weekly notes</p>
    </a>
    <a class="card" href="#">
      <h3>Buyer journey</h3>
      <p>Year one</p>
    </a>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item active" href="/"><span>🏠</span>HOME</a>
  <a class="nav-item" href="#"><span>🔍</span>BROWSE</a>
  <a class="nav-item" href="/radar"><span>◎</span>RADAR</a>
  <a class="nav-item" href="#"><span>🗺️</span>MAP</a>
  <a class="nav-item" href="#"><span>💬</span>MESSAGES</a>
</nav>
</body>
</html>
