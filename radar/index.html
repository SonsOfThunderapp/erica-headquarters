<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Neighborhood Radar — Erica Diaz Team</title>
<meta name="description" content="Sample neighborhood radar for the Erica Diaz Team headquarters.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0A1628;
    --navy-deep: #06101c;
    --navy-lift: #132038;
    --gold: #C9A227;
    --gold-light: #E8D48B;
    --gold-dim: rgba(201,162,39,0.28);
    --text: #f5f0e6;
    --muted: rgba(245,240,230,0.55);
    --danger-fog: rgba(6,16,28,0.78);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--navy-deep);
    color: var(--text);
    font-family: Inter, sans-serif;
    min-height: 100%;
    min-height: 100dvh;
  }
  body { overflow-x: hidden; }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .back {
    color: var(--gold);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 500;
    padding: 8px 0;
  }
  .titles { text-align: right; }
  .eyebrow {
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: "Playfair Display", serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text);
  }

  .sample-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--gold-dim);
    background: rgba(201,162,39,0.07);
    color: var(--gold-light);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 8px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .sample-banner .pip {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }

  .stage-wrap {
    position: relative;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .stage {
    position: relative;
    width: min(100%, 420px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(201,162,39,0.08) 0%, transparent 42%),
      radial-gradient(circle at 50% 50%, #0c1b31 0%, var(--navy-deep) 72%);
    box-shadow:
      0 0 0 1px rgba(201,162,39,0.35),
      0 0 0 8px rgba(10,22,40,1),
      0 0 0 9px rgba(201,162,39,0.22),
      0 24px 64px rgba(0,0,0,0.45),
      inset 0 0 80px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  .rings, .cross, .sweep, .storm, .pings, .center {
    position: absolute; inset: 0; pointer-events: none;
  }
  .ring {
    position: absolute;
    border: 1px solid rgba(201,162,39,0.2);
    border-radius: 50%;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }
  .ring.r1 { width: 25%; height: 25%; }
  .ring.r2 { width: 50%; height: 50%; }
  .ring.r3 { width: 75%; height: 75%; }
  .ring.r4 { width: 96%; height: 96%; border-color: rgba(201,162,39,0.32); }

  .range-label {
    position: absolute;
    top: 50%;
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(232,212,139,0.5);
    pointer-events: none;
    transform: translateY(-50%);
    white-space: nowrap;
  }
  .range-label.rl2 { left: calc(50% + 25.5%); top: 47%; }
  .range-label.rl3 { left: calc(50% + 38%); top: 47%; }

  .cross::before, .cross::after {
    content: "";
    position: absolute;
    background: rgba(201,162,39,0.28);
  }
  .cross::before { left: 50%; top: 6%; bottom: 6%; width: 1px; transform: translateX(-50%); }
  .cross::after { top: 50%; left: 6%; right: 6%; height: 1px; transform: translateY(-50%); }
  .tick {
    position: absolute;
    background: var(--gold);
    opacity: 0.55;
  }
  .tick.n, .tick.s { width: 2px; height: 10px; left: 50%; transform: translateX(-50%); }
  .tick.n { top: 4%; }
  .tick.s { bottom: 4%; }
  .tick.e, .tick.w { height: 2px; width: 10px; top: 50%; transform: translateY(-50%); }
  .tick.e { right: 4%; }
  .tick.w { left: 4%; }
  .compass {
    position: absolute;
    top: 7.5%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--gold);
    font-weight: 600;
  }

  .sweep {
    background: conic-gradient(
      from 0deg,
      rgba(201,162,39,0) 0deg,
      rgba(201,162,39,0) 300deg,
      rgba(201,162,39,0.05) 328deg,
      rgba(201,162,39,0.22) 348deg,
      rgba(232,212,139,0.85) 358deg,
      rgba(232,212,139,0.0) 360deg
    );
    animation: sweep 4.5s linear infinite;
    mix-blend-mode: screen;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }

  .storm {
    background: radial-gradient(
      circle at 50% 50%,
      transparent calc(var(--wall) - 2px),
      rgba(232,212,139,0.95) var(--wall),
      rgba(201,162,39,0.55) calc(var(--wall) + 3px),
      rgba(10,22,40,0.25) calc(var(--wall) + 6px),
      rgba(6,16,28,0.55) calc(var(--wall) + 14px),
      rgba(4,10,18,0.82) 100%
    );
    transition: none;
  }
  .storm::after {
    /* faint second rim, like a falling next-circle preview */
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(201,162,39,0.08);
  }

  .center {
    display: grid;
    place-items: center;
  }
  .you {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,162,39,0.2), 0 0 16px rgba(201,162,39,0.7);
    position: relative;
    z-index: 3;
  }
  .center { z-index: 5; pointer-events: none; }
  .you-label {
    position: absolute;
    top: calc(50% + 18px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    letter-spacing: 0.22em;
    color: var(--gold-light);
    background: rgba(6,16,28,0.72);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .ping {
    position: absolute;
    width: 38px; height: 38px;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    cursor: pointer;
    border: 0;
    background: transparent;
    padding: 0;
    z-index: 4;
  }
  .ping .blip {
    position: absolute;
    left: 50%; top: 50%;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold-light);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--gold);
    z-index: 2;
  }
  .ping .pulse {
    position: absolute;
    left: 50%; top: 50%;
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    transform: translate(-50%, -50%);
    animation: pulse 2.4s ease-out infinite;
    z-index: 1;
  }
  .ping .tile {
    position: absolute;
    left: 50%;
    top: -18px;
    width: 30px; height: 30px;
    transform: translateX(-50%);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45));
    pointer-events: none;
    transition: transform 0.2s ease;
  }
  .ping .tile svg { width: 30px; height: 30px; display: block; }
  .ping.active .tile { transform: translateX(-50%) scale(1.15); }
  .ping.in-storm { opacity: 0.42; }
  .ping.in-storm .pulse { animation: none; opacity: 0.3; }
  .ping:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; border-radius: 8px; }
  @keyframes pulse {
    0% { width: 8px; height: 8px; opacity: 0.8; }
    100% { width: 34px; height: 34px; opacity: 0; }
  }

  .legend {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 2px 0 4px;
  }
  .legend button {
    width: auto;
    background: rgba(201,162,39,0.06);
    border: 1px solid rgba(201,162,39,0.2);
    border-radius: 12px;
    padding: 4px 2px 6px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }
  .legend button.active,
  .legend button:hover {
    border-color: var(--gold);
    background: rgba(201,162,39,0.14);
  }
  .legend svg { width: 100%; max-width: 52px; height: auto; display: block; margin: 0 auto; aspect-ratio: 1; }
  .legend span {
    display: block;
    font-size: 8px;
    letter-spacing: 0.04em;
    text-align: center;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.2;
  }

  .card {
    margin-top: 8px;
    min-height: 96px;
    border: 1px solid rgba(201,162,39,0.28);
    background: linear-gradient(180deg, rgba(201,162,39,0.10), rgba(10,22,40,0.6));
    border-radius: 16px;
    padding: 14px 16px 16px;
    display: none;
  }
  .card.open { display: block; }
  .card-kicker {
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .card h2 {
    font-family: "Playfair Display", serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }
  .card .meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .card .note { margin-top: 8px; font-size: 12px; color: var(--text); line-height: 1.45; }
  .card .warn {
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-light);
  }

  .idle-hint {
    margin-top: 8px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  @media (prefers-reduced-motion: reduce) {
    .sweep, .ping .pulse { animation: none; }
  }
  @media (min-width: 720px) {
    .app { max-width: 560px; padding-top: 24px; }
    h1 { font-size: 24px; }
  }
</style>
</head>

<div class="app">
  <header>
    <a class="back" href="../">← Headquarters</a>
    <div class="titles">
      <div class="eyebrow">Erica Diaz Team</div>
      <h1>Neighborhood Radar</h1>
    </div>
  </header>

  <div class="sample-banner" role="status">
    <span class="pip"></span>
    Sample data — not live listings
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage" aria-label="Neighborhood radar screen">
      <div class="rings">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="ring r4"></div>
        <div class="range-label rl2">1.2 mi</div>
        <div class="range-label rl3">1.8 mi</div>
      </div>
      <div class="cross">
        <span class="tick n"></span><span class="tick s"></span>
        <span class="tick e"></span><span class="tick w"></span>
        <span class="compass">N</span>
      </div>
      <div class="sweep" id="sweep"></div>
      <div class="storm" id="storm"></div>
      <div class="pings" id="pings"></div>
      <div class="center">
        <div class="you" title="You"></div>
        <div class="you-label">YOU</div>
      </div>
    </div>
  </div>

  <div class="legend" id="legend" aria-label="Category tiles"></div>
  <div class="idle-hint" id="hint">Tap a ping or a tile for details.</div>
  <article class="card" id="card" hidden></article>
</div>

<script>
const MAX_MI = 2.4; // maps to the outer usable ring
const CATEGORIES = [
  { id: "school", label: "School", icon: "school" },
  { id: "grocery", label: "Grocery", icon: "grocery" },
  { id: "restaurant", label: "Restaurant", icon: "restaurant" },
  { id: "foodtruck", label: "Food truck", icon: "foodtruck" },
  { id: "theater", label: "Theater", icon: "theater" },
  { id: "park", label: "Park", icon: "park" },
  { id: "festival", label: "Festival", icon: "festival" },
  { id: "ribbon", label: "Grand opening", icon: "ribbon" },
  { id: "cones", label: "Road work", icon: "cones" },
  { id: "burst", label: "Catch-all", icon: "burst" }
];

// SAMPLE events only — labeled as such in the UI. Winter Garden / Horizon West flavor.
const EVENTS = [
  { id: "e1", name: "Horizon High after-school fair", category: "school", distanceMi: 1.2, bearing: 28, note: "Campus gym, 4–7 p.m. Families welcome." },
  { id: "e2", name: "Publix on Daniels Road", category: "grocery", distanceMi: 0.4, bearing: 300, note: "Weekly specials board is up." },
  { id: "e3", name: "Wood-fired trattoria preview", category: "restaurant", distanceMi: 0.8, bearing: 85, note: "Soft opening this weekend." },
  { id: "e4", name: "Market taco truck", category: "foodtruck", distanceMi: 0.3, bearing: 215, note: "Plant Street lot, lunch service only." },
  { id: "e5", name: "Garden Theatre evening showing", category: "theater", distanceMi: 2.1, bearing: 145, note: "Downtown Winter Garden." },
  { id: "e6", name: "Twillman Park lawn concert", category: "park", distanceMi: 0.6, bearing: 255, note: "Sunset set. Bring a blanket." },
  { id: "e7", name: "Founders Day festival", category: "festival", distanceMi: 1.5, bearing: 170, note: "Main Street closed to cars after 10 a.m." },
  { id: "e8", name: "Boutique ribbon cutting", category: "ribbon", distanceMi: 1.8, bearing: 55, note: "Grand opening on Plant Street." },
  { id: "e9", name: "Lane closure on SR 535", category: "cones", distanceMi: 0.9, bearing: 335, note: "Expect delays through Friday." },
  { id: "e10", name: "Plaza pop-up market", category: "burst", distanceMi: 1.1, bearing: 110, note: "One-day vendors, late morning to dusk." }
];

const CAT_BY_ID = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

function polarToPercent(distanceMi, bearingDeg) {
  // Visual floor so close events do not cover the YOU pip. Card still shows true mileage.
  const visualMi = Math.max(distanceMi, 0.7);
  const r = (visualMi / MAX_MI) * 42;
  const rad = (bearingDeg - 90) * Math.PI / 180; // 0 = north
  return {
    left: 50 + r * Math.cos(rad),
    top: 50 + r * Math.sin(rad)
  };
}

function tileSVG(iconId) {
  return `<svg viewBox="0 0 128 128" aria-hidden="true"><use href="#${iconId}"></use></svg>`;
}

const pingsEl = document.getElementById("pings");
const legendEl = document.getElementById("legend");
const cardEl = document.getElementById("card");
const hintEl = document.getElementById("hint");
const stormEl = document.getElementById("storm");

let selected = null;
let wallMi = 2.15;

function renderLegend() {
  legendEl.innerHTML = CATEGORIES.map(c => `
    <button type="button" data-cat="${c.id}" aria-label="${c.label}">
      ${tileSVG(c.icon)}
      <span>${c.label}</span>
    </button>
  `).join("");
}

function renderPings() {
  pingsEl.innerHTML = EVENTS.map(ev => {
    const { left, top } = polarToPercent(ev.distanceMi, ev.bearing);
    const inStorm = ev.distanceMi > wallMi;
    return `<button class="ping${inStorm ? " in-storm" : ""}${selected===ev.id?" active":""}"
      type="button" data-id="${ev.id}"
      style="left:${left.toFixed(2)}%;top:${top.toFixed(2)}%"
      aria-label="${ev.name}, ${ev.distanceMi} miles, ${CAT_BY_ID[ev.category].label}${inStorm ? ", beyond the wall" : ""}">
        <span class="tile">${tileSVG(ev.category)}</span>
        <span class="pulse"></span>
        <span class="blip"></span>
      </button>`;
  }).join("");
}

function showEvent(id) {
  const ev = EVENTS.find(e => e.id === id);
  if (!ev) return;
  selected = id;
  const cat = CAT_BY_ID[ev.category];
  const inStorm = ev.distanceMi > wallMi;
  cardEl.hidden = false;
  cardEl.classList.add("open");
  hintEl.style.display = "none";
  cardEl.innerHTML = `
    <div class="card-kicker">
      <span>${cat.label}</span>
      <span>Sample</span>
    </div>
    <h2>${ev.name}</h2>
    <div class="meta">
      <span>${ev.distanceMi.toFixed(1)} mi</span>
      <span>${bearingLabel(ev.bearing)}</span>
    </div>
    <p class="note">${ev.note}</p>
    ${inStorm ? '<p class="warn">Currently beyond the storm wall</p>' : ""}
  `;
  document.querySelectorAll(".legend button").forEach(b => b.classList.toggle("active", b.dataset.cat === ev.category));
  renderPings();
}

function bearingLabel(deg) {
  const dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return dirs[Math.round(deg / 22.5) % 16];
}

pingsEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".ping");
  if (btn) showEvent(btn.dataset.id);
});
legendEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-cat]");
  if (!btn) return;
  const ev = EVENTS.find(x => x.category === btn.dataset.cat);
  if (ev) showEvent(ev.id);
});

function stormFrame(t) {
  // Fortnite-style: contract, hold, then a new (larger) wall drops and contracts again.
  const cycle = 22000;
  const p = (t % cycle) / cycle;
  let mi;
  if (p < 0.55) {
    const k = p / 0.55;
    mi = 2.15 - (2.15 - 1.05) * easeInOut(k);
  } else if (p < 0.72) {
    mi = 1.05;
  } else {
    const k = (p - 0.72) / 0.28;
    // new circle appears farther out, then starts pulling in
    mi = 2.05 - (2.05 - 1.55) * easeInOut(k);
  }
  return mi;
}
function easeInOut(k){ return k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2,2)/2; }

function wallToPercent(mi) {
  // 50% is the full radius of the disk; usable content sits inside ~48%
  const pct = (mi / MAX_MI) * 48;
  return pct + "%";
}

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let start = performance.now();

function tick(now) {
  if (!reduceMotion) {
    wallMi = stormFrame(now - start);
  } else {
    wallMi = 1.6;
  }
  stormEl.style.setProperty("--wall", wallToPercent(wallMi));
  // update storm dimming without rebuilding if possible
  pingsEl.querySelectorAll(".ping").forEach(btn => {
    const ev = EVENTS.find(e => e.id === btn.dataset.id);
    if (!ev) return;
    btn.classList.toggle("in-storm", ev.distanceMi > wallMi);
  });
  if (selected) {
    const ev = EVENTS.find(e => e.id === selected);
    if (ev) {
      const warn = cardEl.querySelector(".warn");
      const should = ev.distanceMi > wallMi;
      if (should && !warn) {
        cardEl.insertAdjacentHTML("beforeend", '<p class="warn">Currently beyond the storm wall</p>');
      } else if (!should && warn) {
        warn.remove();
      }
    }
  }
  requestAnimationFrame(tick);
}

renderLegend();
renderPings();
requestAnimationFrame(tick);
const boot = new URLSearchParams(location.search).get("e");
if (boot) showEvent(boot);
</script>
</body>
</html>
